; Карта тривог v2 — ESP32-C3
; Відкрити папку в VS Code з PlatformIO, далі:
;   1) Upload                    (заливає прошивку)
;   2) Upload Filesystem Image  (заливає data/index.html у LittleFS)
;      або завантажити index.html через браузер зі сторінки пристрою.

[platformio]
default_envs = esp32c3

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv   ; 2 слоти OTA по 1,9 МБ + LittleFS 128 КБ
board_upload.flash_size = 4MB
board_upload.maximum_size = 1966080
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.2.1

; Плати з одним портом USB (C3 SuperMini, DevKitM-1 через USB чипа):
; Serial іде через вбудований USB.
[env:esp32c3]
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Знижена потужність Wi-Fi: лікує нестабільне підключення на дешевих C3 SuperMini.
    ; На якісній платі постав 0, буде більша дальність.
    -D LOW_TX_POWER=1

; Плати з мостом USB-UART (CH340 / CP2102).
[env:esp32c3-uart]
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D LOW_TX_POWER=0
